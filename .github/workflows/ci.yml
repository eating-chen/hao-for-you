name: CI

# Push 到任何 branch 或開 PR 時觸發
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ──────────────────────────────────────────────
  # Step 0：偵測哪些目錄有異動，決定要跑哪些 job
  # ──────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Check which directories changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'hao-for-you-gateway/**'
            service:
              - 'hao-for-you-service/**'

  # ──────────────────────────────────────────────
  # Job 1：hao-for-you-gateway（Java / Spring Boot）
  # ──────────────────────────────────────────────
  java-check:
    name: Java Code Check
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 21 環境（對應 pom.xml 的 java.version）
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 快取 Maven 套件，加速後續 build
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('hao-for-you-gateway/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 編譯檢查：確保程式碼可以編譯通過（有語法錯誤或 import 錯誤會在這裡失敗）
      - name: Compile
        working-directory: hao-for-you-gateway
        run: mvn compile --no-transfer-progress -q

      # 執行單元測試
      - name: Run tests
        working-directory: hao-for-you-gateway
        run: mvn test --no-transfer-progress

      # Checkstyle：程式碼風格檢查（Google Java Style）
      # 使用 continue-on-error: true → 風格問題只警告，不擋住 CI
      # 若要改成強制必過，請把 continue-on-error 移除，並在 pom.xml 加入 checkstyle plugin 設定
      - name: Checkstyle (Google Style)
        working-directory: hao-for-you-gateway
        continue-on-error: true
        run: |
          mvn checkstyle:check --no-transfer-progress \
            -Dcheckstyle.config.location=google_checks.xml \
            -Dcheckstyle.failOnViolation=true \
            -Dcheckstyle.violationSeverity=warning

  # ──────────────────────────────────────────────
  # Job 2：hao-for-you-service（Python / FastAPI）
  # ──────────────────────────────────────────────
  python-check:
    name: Python Code Check
    needs: changes
    if: ${{ needs.changes.outputs.service == 'true' }}
    runs-on: ubuntu-latest

    env:
      # 測試環境用假金鑰，避免 config.py 載入時因缺少環境變數而報錯
      LINE_CHANNEL_SECRET: dummy-secret
      LINE_CHANNEL_ACCESS_TOKEN: dummy-token
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8008/auth/google/callback
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      ENV: dev

    steps:
      - uses: actions/checkout@v4

      # 安裝 uv（Python 套件管理工具，對應本地開發環境）
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      # 讀取根目錄 .python-version（3.10.4）設定 Python 版本
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # 安裝所有依賴套件（依照 uv.lock 版本鎖定）
      - name: Install dependencies
        working-directory: hao-for-you-service
        run: uv sync

      # Ruff：Python linting 檢查（未使用變數、錯誤 import、語法問題等）
      # uvx 會自動下載 ruff，不需要預先安裝
      - name: Lint with ruff
        working-directory: hao-for-you-service
        run: uvx ruff check . --output-format=github

      # Ruff format：檢查程式碼排版是否一致（不自動修改）
      - name: Check formatting with ruff
        working-directory: hao-for-you-service
        run: uvx ruff format . --check

      # 執行測試
      - name: Run tests
        working-directory: hao-for-you-service
        run: uv run pytest --tb=short -q
