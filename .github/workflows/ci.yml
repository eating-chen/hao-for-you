name: CI

# Push 到任何 branch 或開 PR 時觸發
on:
  # push:
  #   branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ──────────────────────────────────────────────
  # Step 0：偵測哪些目錄有異動，決定要跑哪些 job
  # ──────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Check which directories changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'hao-for-you-gateway/**'
            service:
              - 'hao-for-you-service/**'

  # ──────────────────────────────────────────────
  # Job 1：hao-for-you-gateway（Java / Spring Boot）
  # ──────────────────────────────────────────────
  java-check:
    name: Java Build & Test & Docker
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud 需要完整 git 歷史做 blame 分析

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('hao-for-you-gateway/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 1：編譯
      - name: Build
        working-directory: hao-for-you-gateway
        run: mvn compile --no-transfer-progress -q

      # Step 2：測試
      - name: Test
        working-directory: hao-for-you-gateway
        run: mvn test --no-transfer-progress

      # Step 3：SonarQube Cloud 靜態分析 + 安全性掃描
      # 需要在 GitHub Repo Settings 設定：
      #   Secrets → SONAR_TOKEN        (從 sonarcloud.io 取得)
      #   Secrets → SONAR_ORGANIZATION (sonarcloud.io 組織 key)
      #   Secrets → SONAR_PROJECT_KEY  (sonarcloud.io 專案 key)
      - name: SonarQube Cloud Scan
        working-directory: hao-for-you-gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          echo "SONAR_ORGANIZATION : ${SONAR_ORGANIZATION}"
          echo "SONAR_PROJECT_KEY : ${SONAR_PROJECT_KEY}"
          mvn sonar:sonar --no-transfer-progress \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # Step 4：Docker build（Dockerfile 內部會執行 mvn package -DskipTests）
      - name: Docker Build
        working-directory: hao-for-you-gateway
        run: docker build -t hao-for-you-gateway:ci .

  # ──────────────────────────────────────────────
