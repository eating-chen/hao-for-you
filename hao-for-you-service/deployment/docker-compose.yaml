services:
  api:
    build:
      context: ../
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - ../.env
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    build:
      context: ../
      dockerfile: Dockerfile.ollama
    ports:
      - "11434:11434"
    security_opt:
      - seccomp=unconfined
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ollama-data:
