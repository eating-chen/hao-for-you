services:
  api:
    build:
      context: ../
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://haoforyou:haoforyou@ai-postgres:5432/haoforyou?sslmode=disable
      GATEWAY_BASE_URL: http://app:8008
    depends_on:
      ollama:
        condition: service_healthy
      ai-postgres:
        condition: service_healthy

  ollama:
    build:
      context: ../
      dockerfile: Dockerfile.ollama
    # gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "11434:11434"
    security_opt:
      - seccomp=unconfined
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ai-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haoforyou
      POSTGRES_USER: haoforyou
      POSTGRES_PASSWORD: haoforyou
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U haoforyou -d haoforyou"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  ollama-data:
  postgres-data:
