services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haoforyou
      POSTGRES_USER: haoforyou
      POSTGRES_PASSWORD: haoforyou
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haoforyou -d haoforyou"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: haoforyou:latest
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # container 內 DB 要用 service 名稱 db，覆蓋 .env 裡的 localhost
      DB_URL: jdbc:postgresql://db:5432/haoforyou
      # gateway 在容器內，要連到「另一包 compose 的」hao-for-you-service（跑在 host 8080）
      HAO_SERVICE_URL: http://api:8080
    extra_hosts:
      # Linux 上讓 host.docker.internal 可解析（Docker Desktop 內建，這行確保跨平台）
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure:3"
    networks:
        - default
        - deployment

volumes:
  pg-data:

networks:
    deployment:
      external: true
      name: deployment_default
