# dev profile：連 docker compose 拉起的 Postgres 容器（服務名 db）
# 用 env 帶預設值，必要時可由 compose / 環境變數覆寫
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/haoforyou}
spring.datasource.username=${DB_USER:haoforyou}
spring.datasource.password=${DB_PASSWORD:haoforyou}
spring.datasource.driver-class-name=org.postgresql.Driver

# 由 Hibernate 依 entity 自動建表（users / google_tokens）
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
