# 預設啟動 dev profile（可用 SPRING_PROFILES_ACTIVE=prod 覆寫）
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server（gateway 使用 8008，避免與 hao-for-you-service 的 8080 衝突）
server.port=${PORT:8008}

# JPA（共用，DB 連線設定見各 profile）
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# LINE Bot
line.bot.channel-token=${LINE_CHANNEL_ACCESS_TOKEN:}
line.bot.channel-secret=${LINE_CHANNEL_SECRET:}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8008/google/auth/callback}

# hao-for-you-service URL（LLM 推論由 service 端負責）
app.service-url=${HAO_SERVICE_URL:http://localhost:8080}

# App
app.conversation.max-turns=10
