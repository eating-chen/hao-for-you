# Server（gateway 使用 8080，避免與 hao-for-you-service 的 8008 衝突）
server.port=${PORT:8080}

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/haoforyoudb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=haoforyou_user
spring.datasource.password=hao0207

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# LINE Bot
line.bot.channel-token=${LINE_CHANNEL_ACCESS_TOKEN:}
line.bot.channel-secret=${LINE_CHANNEL_SECRET:}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}

# hao-for-you-service URL（LLM 推論由 service 端負責）
app.service-url=${HAO_SERVICE_URL:http://localhost:8008}

# App
app.conversation.max-turns=10
app.system-prompt=你叫 Hao，是一位 AI 助手\n請用繁體中文回答，語氣友善、專業、簡潔\n除非使用者要求，否則不要提供範例、不要重複問題、不要延伸補充
