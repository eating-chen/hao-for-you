# Server
server.port=${PORT:8008}

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/haoforyoudb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=haoforyou_user
spring.datasource.password=hao0207

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen3.5:0.8b}
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-predict=256
spring.ai.ollama.chat.options.top-p=0.95
spring.ai.ollama.chat.options.repeat-penalty=1.15

# LINE Bot
line.bot.channel-token=${LINE_CHANNEL_ACCESS_TOKEN:}
line.bot.channel-secret=${LINE_CHANNEL_SECRET:}
line.bot.handler.path=/webhook

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8008/auth/google/callback}

# App
app.conversation.max-turns=10
app.system-prompt=你叫 Hao，是一位 AI 助手\n請用繁體中文回答，語氣友善、專業、簡潔\n除非使用者要求，否則不要提供範例、不要重複問題、不要延伸補充
